    known_limitations:
      - "WO-026: this is Singapore hub activity, not a Thailand measurement. Singapore is a transshipment hub for Thailand cargo, so it is relevant to Thailand only through the transshipment mechanism, which must be stated rather than assumed -- the same caveat MPA_SG_NOTICE already carries."
      - Throughput and vessel-call counts are volume measures. They can never on their own establish congestion, waiting time or berth delay.
      - "WO-027: the Datastore Search endpoint and the two datasets' field names are now human-confirmed against the primary data.gov.sg pages (container_throughput, number_of_vessels, gross_tonnage), correcting WO-026's wrong guesses (total_teus, total_vessels). See docs/mpa_sg_statistics_qualification.md §2."
      - "WO-027: container_throughput's raw numeric scale does not obviously match individual TEUs against official MPA annual statements (41.12M TEU for 2024, 44.66M TEU for 2025). The unit/scale is unverified and must not be assumed or converted by a guessed factor -- collectors/adapters/data_gov_sg.py's DatastoreSeriesSpec.unit_verified defaults to False (fail-closed), so parsing this series requires a caller to affirmatively mark the unit trustworthy; no production spec exists yet that does so. See docs/mpa_sg_statistics_qualification.md §3."
      - gross_tonnage is a confirmed real field on the vessel-arrivals dataset but is not wired into any parsed capability; it must be assessed separately before being added, per the human decision recorded on Issue #56.
      - Covers two Datastore Search resources under one contract -- container throughput and vessel arrivals -- distinguished by resource_id, the same one-contract/multiple-series pattern PAT_STATISTICS uses for its two terminals.
      - Registration requirement is recorded as none because data.gov.sg's own developer documentation states public Datastore Search reads need no API key; anonymous access is rate-limited (documented as 4 Datastore Search calls / 10s, 2 dataset-download calls / 10s) and this has not yet been independently observed.
      - No personal data, third-party rights, patents, trademarks or design rights are expected in an aggregate monthly statistics series, but this has not yet been positively confirmed against a real response, which the Singapore Open Data Licence v1.0 requires before publication.
      - "WO-027: a bounded 2-request controlled live validation is human-authorized (Issue #56) but not yet executed -- this environment's outbound network access to data.gov.sg is denied by the session's auto-mode permission classifier, and WebFetch cannot satisfy the validation's raw-bytes/header/hash retention requirements. See docs/mpa_sg_statistics_qualification.md §7."
