name: Dependency vulnerability audit

# WO-013: a newly-disclosed CVE against an already-merged pin should surface
# on its own schedule, not wait for the next pull request. Deliberately no
# push/pull_request trigger: validate-pr.yml already runs the same audit on
# every PR; this is the standing weekly check for pins nobody has touched.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.9.0
      - name: Audit locked dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock
